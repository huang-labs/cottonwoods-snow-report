name: Deploy

# Every push to main is tested, then deployed to production
# (cottonwoods-snow-report.huang.mx). Pull requests are tested, then uploaded as a
# non-deployed Worker version with a stable per-PR preview URL
# (pr-<number>-cottonwoods-snow-report.huang-inc.workers.dev), linked in a PR comment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; a newer push waits for the current one.
# On a PR, a newer push cancels the in-flight run instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run cf:build
      - run: npm run smoke

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cottonwoods-snow-report.huang.mx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy (static export + Worker)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    needs: test
    # Only for PRs from this repo: fork and Dependabot PRs get no secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static frontend
        run: npm run build
        env:
          SITE_URL: https://pr-${{ github.event.pull_request.number }}-cottonwoods-snow-report.huang-inc.workers.dev
      # Uploads a version without deploying it: production traffic and cron
      # triggers stay on the deployed version. The preview shares production
      # bindings, so it reads the live KV snapshot.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          ALIAS: pr-${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx wrangler versions upload --preview-alias "$ALIAS" --tag "${SHA:0:7}"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          if [ -z "$url" ]; then
            echo "::error::No preview alias URL in wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify deployed share previews
        run: npx tsx scripts/check-share-preview.ts "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
      - name: Comment preview link on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '### Preview\n\n%s\n\nUpdated for %s. Uses production data (read-only); cron collection does not run on previews.' "$URL" "${SHA:0:7}")
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
